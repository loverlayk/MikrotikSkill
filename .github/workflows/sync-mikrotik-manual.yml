name: Sync MikroTik Manual

on:
  schedule:
    - cron: "17 2 * * *"

  workflow_dispatch:
    inputs:
      clean:
        description: "Clean rebuild before sync"
        required: false
        default: false
        type: boolean

      limit:
        description: "Optional page limit for testing (0 = all)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: python -m pip install requests

      - name: Sync official MikroTik Manual
        env:
          CLEAN: ${{ inputs.clean }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=""

          if [ "$CLEAN" = "true" ]; then
            args="$args --clean"
          fi

          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then
            args="$args --limit $LIMIT"
          fi

          python skills/mikrotik-routeros-official/scripts/sync_mikrotik_manual.py $args

      - name: Read sync summary
        id: summary
        run: |
          python - <<'PY'
          import json
          import os

          path = "skills/mikrotik-routeros-official/references/_sync-summary.json"

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          print(json.dumps(data, indent=2))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={data['changed']}\n")
              f.write(f"removed={data['removed']}\n")
              f.write(f"failed={data['failed']}\n")
          PY

      - name: Commit documentation changes
        if: steps.summary.outputs.changed != '0' || steps.summary.outputs.removed != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f skills/mikrotik-routeros-official/references

          git commit -m "chore: sync official MikroTik manual"
          git push

      - name: Create release
        if: steps.summary.outputs.changed != '0' || steps.summary.outputs.removed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y.%m.%d)
          TAG="manual-${DATE}-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            --title "MikroTik Manual Sync $DATE" \
            --generate-notes
